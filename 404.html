<link rel="icon" href="assets/favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="assets/favicon.png">

<style>
  /* 404-only layout: a single centred panel on the dot grid. */
  .nf-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 80px 24px; }
  .nf-card { position: relative; z-index: 1; max-width: 520px; width: 100%; background: var(--bg2); border: 1px solid var(--border); padding: 44px 40px; }
  .nf-card::before, .nf-card::after,
  .nf-b::before, .nf-b::after { content:''; position:absolute; width:10px; height:10px; border:1px solid var(--orange-border); }
  .nf-card::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
  .nf-card::after  { top:-1px; right:-1px; border-width:1px 1px 0 0; }
  .nf-b::before { bottom:-1px; left:-1px; border-width:0 0 1px 1px; }
  .nf-b::after  { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }
  .nf-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); background: var(--orange-dim); border: 1px solid var(--orange-border); border-radius: 4px; padding: 2px 8px; display: inline-block; margin-bottom: 22px; }
  .nf-code { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: 0.04em; margin-bottom: 6px; }
  .nf-title { font-family: var(--font); font-size: clamp(26px, 4vw, 34px); font-weight: 500; line-height: 1.1; letter-spacing: -0.025em; color: var(--text); margin-bottom: 14px; }
  .nf-text { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
  .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="nf-wrap">
  <div class="dot-bg"></div>
  <div class="nf-card">
    <span class="nf-b"></span>
    <span class="nf-tag">Error · Not Found</span>
    <div class="nf-code">--route: undefined</div>
    <h1 class="nf-title">This page doesn't exist.</h1>
    <p class="nf-text">The URL points to something that was moved, renamed, or never shipped — same discipline as a token with no reference.</p>
    <div class="nf-actions">
      <a href="/" class="btn-primary">Back to home →</a>
      <a href="/work/" class="btn-ghost">View work →</a>
    </div>
  </div>
</div>

</body>
</html>
